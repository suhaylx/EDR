name: starter-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: go test ./...
      - run: go vet ./...

  scan-status-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser scan status unit tests
        run: node --test backend/web/scan-display.test.js
      - name: TypeScript scan status unit tests
        working-directory: frontend
        run: |
          npm exec --yes --package=typescript@5.8.3 -- tsc src/scan-state.ts --module commonjs --target es2020 --outDir dist --strict --noEmitOnError
          node --test tests/scan-state.test.mjs

  rust-agent-scaffold:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
