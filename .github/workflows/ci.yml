name: starter-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: go test ./...
      - run: go vet ./...

  rust-agent-scaffold:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - run: cargo test

  lab-dashboard-auth-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check backend/web/app.js
      - run: node --check backend/web/auth-session.js
      - run: node --test backend/web/auth-session.test.cjs
