name: starter-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: go test ./...
      - run: go vet ./...

  rust-agent-scaffold:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - run: cargo test

  rust-agent-windows:
    name: Rust agent unit tests (Windows Server 2022)
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
