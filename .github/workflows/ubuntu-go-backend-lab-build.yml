name: ubuntu-go-backend-lab-build

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/LAB_RELEASE_CANDIDATE_DAY3.md'
      - 'scripts/smoke-ubuntu-lab-api.sh'
      - '.github/workflows/ubuntu-go-backend-lab-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-2404-go-api:
    name: Test and build Ubuntu 24.04 x64 Go lab API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Go tests and vet
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
      - name: Compile API and stage web assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/turansec-ubuntu-go-lab/bin dist/turansec-ubuntu-go-lab/web
          (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w" -o ../dist/turansec-ubuntu-go-lab/bin/turansec-edr-api ./cmd/server)
          cp -a backend/web/. dist/turansec-ubuntu-go-lab/web/
          cp docs/LAB_RELEASE_CANDIDATE_DAY3.md dist/turansec-ubuntu-go-lab/README.md
          (cd dist/turansec-ubuntu-go-lab && \
            find bin web -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          file dist/turansec-ubuntu-go-lab/bin/turansec-edr-api
      - name: Run executable local-only API and SOC smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke-ubuntu-lab-api.sh dist/turansec-ubuntu-go-lab/bin/turansec-edr-api
      - name: Publish lab-only API and static dashboard assets
        uses: actions/upload-artifact@v4
        with:
          name: TuranSec-EDR-Lab-Ubuntu-Go-Backend-x64
          path: dist/turansec-ubuntu-go-lab/
          if-no-files-found: error
          retention-days: 14
