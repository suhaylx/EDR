name: postgres-enrollment-integration

on:
  pull_request:
    paths:
      - "backend/migrations/**"
      - "backend/internal/edr/agent_registry_postgres*"
      - "scripts/test-enrollment-migration.sh"
      - ".github/workflows/postgres-enrollment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrollment-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edr_migration_test
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: edr_enrollment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edr_migration_test -d edr_enrollment_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run isolated enrollment migration and constraint checks
        env:
          EDR_TEST_DATABASE_URL: postgresql://edr_migration_test:ci-disposable-only@127.0.0.1:5432/edr_enrollment_test?sslmode=disable
        run: bash scripts/test-enrollment-migration.sh
