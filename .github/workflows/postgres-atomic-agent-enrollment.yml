name: postgres-atomic-agent-enrollment
on:
  pull_request:
    paths:
      - "backend/migrations/**"
      - "scripts/test-atomic-agent-enrollment.sh"
      - ".github/workflows/postgres-atomic-agent-enrollment.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edr_atomic_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: edr_atomic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edr_atomic_ci -d edr_atomic_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Test atomic agent enrollment
        env:
          EDR_TEST_DATABASE_URL: postgresql://edr_atomic_ci:disposable-ci-only@127.0.0.1:5432/edr_atomic_test?sslmode=disable
        run: bash scripts/test-atomic-agent-enrollment.sh
