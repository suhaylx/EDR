name: Windows lab preflight
on:
  pull_request:
    paths:
      - 'scripts/windows-lab-preflight.ps1'
      - 'scripts/test-windows-lab-preflight.ps1'
      - '.github/workflows/windows-lab-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parser and read-only smoke checks
        shell: pwsh
        run: ./scripts/test-windows-lab-preflight.ps1
