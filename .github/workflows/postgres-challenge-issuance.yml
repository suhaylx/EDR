name: postgres-challenge-issuance
on:
  pull_request:
    paths:
      - "backend/migrations/**"
      - "scripts/test-enrollment-challenge-issuance.sh"
      - ".github/workflows/postgres-challenge-issuance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenge-issuance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edr_issue_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: edr_challenge_issuance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edr_issue_ci -d edr_challenge_issuance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify authenticated challenge-issuance DB invariants
        env:
          EDR_TEST_DATABASE_URL: postgresql://edr_issue_ci:disposable-ci-only@127.0.0.1:5432/edr_challenge_issuance_test?sslmode=disable
        run: bash scripts/test-enrollment-challenge-issuance.sh
