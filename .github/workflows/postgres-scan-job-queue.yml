name: postgres-scan-job-queue
on:
  pull_request:
    paths:
      - "backend/migrations/**"
      - "scripts/test-scan-job-queue.sh"
      - "scripts/test-scan-job-postcommit-revocation.sh"
      - "scripts/test-scan-job-concurrent-claims.sh"
      - ".github/workflows/postgres-scan-job-queue.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edr_queue_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: edr_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edr_queue_ci -d edr_queue_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Test durable scan-job queue
        env:
          EDR_TEST_DATABASE_URL: postgresql://edr_queue_ci:disposable-ci-only@127.0.0.1:5432/edr_queue_test?sslmode=disable
        run: |
          bash scripts/test-scan-job-queue.sh
          bash scripts/test-scan-job-postcommit-revocation.sh
          EDR_QA_DISPOSABLE_DB=yes bash scripts/test-scan-job-concurrent-claims.sh
