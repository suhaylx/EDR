name: postgres-revocation-integration
on:
  pull_request:
    paths:
      - "backend/migrations/**"
      - "scripts/test-enrollment-revocation.sh"
      - ".github/workflows/postgres-revocation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revocation-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edr_revocation_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: edr_revocation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edr_revocation_ci -d edr_revocation_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Test audited revocation and append-only constraints
        env:
          EDR_TEST_DATABASE_URL: postgresql://edr_revocation_ci:disposable-ci-only@127.0.0.1:5432/edr_revocation_test?sslmode=disable
        run: bash scripts/test-enrollment-revocation.sh
