# Original TuranSec security detection rule; specification for the Go lab heuristic.
# MITRE ATT&CK T1055 is a hypothesis for triage, not confirmed process injection.
id: TURAN-WIN-PROC-REMOTE-THREAD-001
version: 1
platform: windows
status: lab_prototype
name: Process handle access followed by observed remote thread
source: sysmon
required_events:
  - event_id: 10
    type: process_access
    required: [device_id, boot_id, source_process_guid, target_process_guid, granted_access, source_record_id, time]
  - event_id: 8
    type: create_remote_thread
    required: [device_id, boot_id, source_process_guid, target_process_guid, remote_thread_id, source_record_id, time]
join:
  same_device: true
  same_reported_boot: true
  same_source_process_guid: true
  same_target_process_guid: true
  different_source_and_target: true
  source_record_ids_must_differ: true
  process_access_before_remote_thread_seconds_max: 120
access_mask:
  required_all:
    - PROCESS_CREATE_THREAD # 0x0002
    - PROCESS_VM_OPERATION  # 0x0008
    - PROCESS_VM_WRITE      # 0x0020
  note: granted rights do not prove the memory rights were exercised
suppress_when:
  - event_is_missing_or_wrong_sysmon_event_id
  - self_target_process
  - missing_reported_boot_or_source_record_id
  - inconsistent_source_or_target_process_guid
  - missing_or_weak_process_access_mask
  - wrong_temporal_order_or_gap_over_2_minutes
  - repeated_pair_within_one_detection_evaluation
output:
  category: process_access_remote_thread_correlation
  severity: medium
  confidence: low
  action: alert_only
  evidence_ids: [process_access_event_id, remote_thread_event_id]
  deduplicate: one_per_reported_device_boot_source_target_pair
mitre_hypothesis:
  - T1055 # Process Injection; unconfirmed
false_positives:
  - security software and debuggers legitimately access and manipulate process memory
  - profilers, accessibility and application instrumentation may create remote threads
  - granted access rights do not demonstrate actual memory writing
  - Sysmon source and boot provenance are unverified in the laboratory model
  - strict three-bit access gate may miss other methods; it is a specificity trade-off
safety:
  no_automatic_quarantine: true
  no_malware_confirmation: true
  no_verified_code_injection_claim: true
  enable_event_10_selectively_after_volume_measurement: true
