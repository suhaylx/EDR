# Original TuranSec rule specification. This YAML documents the executable Go
# laboratory heuristic but is NOT ingested by a generic rule engine or Sigma.
# Do not copy vendor signatures or infer infection from these conditions.
id: TURAN-WIN-DLL-LOAD-001
version: 2
schema_version: turansec-rule-spec/v1
platform: windows
status: lab_prototype
name: Provisional DLL ImageLoad from a likely user-writable location
ownership: security-functionality
inputs:
  normalized_type: module_load
  intended_windows_source_event_id: 7
  required: [id, device_id, process_guid, image, file_path, time]
  source_integrity: unauthenticated_lab_sender
  source_event_id_status: sender_reported_unverified_in_lab
match:
  extension: .dll
  case_insensitive_normalized_path_contains_any:
    - '\users\'
    - '\appdata\'
    - '\temp\'
    - '\downloads\'
  source_file_creation_is_not_execution: true
correlate_optional:
  normalized_type: file_create
  intended_windows_source_event_id: 11
  same_device_id: true
  same_lowercased_separator_normalized_path_string: true
  same_nonempty_reported_boot_id: true
  incompatible_reported_process_guids_refuse_link: true
  both_sha256_values_must_be_complete_hex_and_equal: true
  source_event_id_nonblank: true
  prior_to_load_only: true
  maximum_age_hours: 24
  # Standard Sysmon EID 11 does not prove a file hash. This optional link
  # requires a separately observed trusted hash in production.
outputs:
  rule_id: TURAN-WIN-DLL-LOAD-001
  category: suspicious_dll_load
  severity: medium
  confidence: low
  source_load_event_id: required
  corroborating_file_create_event_id: optional
  action: alert_only
  infected_or_confirmed_malware: false
false_positive_control:
  expected_benign_examples:
    - benign installers and application self-updates loading modules from temp
    - legitimate development tools and user-profile applications
  default_suppressions: none
  suppression_proposal: tenant_scoped_reasoned_expiring_rule_versioned_audited
  never_suppress_all_unknown_signers: true
coverage_and_limitations:
  - event_7_collection_may_be_disabled_or_selective
  - no_claim_of_windows_linux_sysmon_event_parity
  - source_provider_and_windows_event_id_are_not_yet_authenticated_in_go_lab
  - path_is_heuristic_not_trusted_canonical_windows_path
  - file_create_process_guid_is_the_writer_not_necessarily_loading_process
  - no_trusted_authenticode_signer_or_file_ownership_available
  - a_no_match_or_absent_eid7_does_not_prove_safety
qa:
  fixture: tests/fixtures/security/dll-correlation-v2.json
  executable_test: backend/internal/edr/detection_fixture_test.go
  scenarios: 17
safety:
  automatic_quarantine: false
  execution_inferred_from_file_create: false
  irreversible_deletion: false
  production_enabled: false
