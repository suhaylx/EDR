# Original TuranSec laboratory detection specification, not production Sigma.
# Requires actual Sysmon ImageLoad (Event ID 7), not FileCreate (Event ID 11).
id: TURAN-WIN-DLL-LOAD-001
version: 1
platform: windows
status: lab_prototype
name: DLL load from potentially user-writable location
inputs:
  event_source: sysmon
  event_id: 7
  required: [device_id, process_guid, process_image, module_path, event_time]
match:
  module_extension: .dll
  module_path_case_insensitive_contains_any:
    - '\users\'
    - '\appdata\'
    - '\temp\'
    - '\downloads\'
correlate_optional:
  prior_file_create_event_id: 11
  same_device_and_normalized_module_path: true
  maximum_age_hours: 24
output:
  category: suspicious_dll_load
  severity: medium
  confidence: low
  action: alert_only
false_positives:
  - legitimate software and installers may load DLLs in user-writable locations
  - paths alone cannot establish malware or signer trust
safety:
  never_infer_execution_from_file_create: true
  quarantine_automatically: false
  no_irreversible_delete: true
