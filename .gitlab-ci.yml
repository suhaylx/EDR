# TuranSec EDR -- alternate CI for the *existing* private suhaylx/EDR
# GitHub repository connected read-only to GitLab CI/CD for external repos.
# A dedicated project runner tagged turansec-edr-ci uses a NON-privileged Docker
# executor on a DISPOSABLE CI VM. Nothing here deploys an EDR endpoint.
# Jobs execute at the exact checked-out commit; individual PostgreSQL services
# are isolated per job. See docs/qa/GITLAB_ISOLATED_CI_RUNBOOK.md.
stages:
  - preflight
  - test
  - postgres

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

default:
  tags:
    - turansec-edr-ci
  interruptible: true

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  CI_DEBUG_TRACE: "false"

source_provenance:
  stage: preflight
  image: alpine:3.21
  script:
    - test -f backend/go.mod
    - test -f agent/Cargo.toml
    - test -f scripts/test-postgres-migration-chain.sh
    - test -f scripts/test-scan-job-queue.sh
    - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
    - echo "GitLab pipeline source commit $CI_COMMIT_SHA (unmerged; NOT a production release)"
    - echo "Canonical source must be the configured read-only GitHub external repository suhaylx/EDR"

go_backend:
  stage: test
  image: golang:1.25-bookworm
  script:
    - go version
    - cd backend
    - go test ./...
    - go test -race -count=1 ./...
    - go vet ./...

rust_linux:
  stage: test
  image: rust:1.88-bookworm
  script:
    - rustc --version
    - cargo test --manifest-path agent/Cargo.toml --all-targets
    - cargo check --manifest-path agent/Cargo.toml --all-targets

rust_windows_cross_check:
  stage: test
  image: rust:1.88-bookworm
  # Cross-target type checking on Linux: NOT a native Windows test run.
  before_script:
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo check --manifest-path agent/Cargo.toml --target x86_64-pc-windows-gnu --all-targets
    - echo "Windows target compiled in Linux; native Windows test and service behavior NOT RUN"

node_served_lab:
  stage: test
  image: node:22-bookworm
  script:
    - node --version
    - |
      for file in backend/web/*.js; do
        test -f "$file" || continue
        node --check "$file"
      done
      found=0
      for file in backend/web/*.test.js; do
        test -f "$file" || continue
        found=1
        node --test "$file"
      done
      if test "$found" -eq 0; then
        echo "No Node-native Go-served UI test files on this Git commit; NOT RUN"
      fi

react_soc_ui:
  stage: test
  image: node:22-bookworm
  rules:
    - exists:
        - frontend/package.json
  script:
    - cd frontend
    # This GitHub project currently has no frontend/package-lock.json.
    # npm install matches existing starter CI, but is not a reproducible lockfile install.
    - npm install --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run build

.postgres16:
  stage: postgres
  image: python:3.12-bookworm
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: edr_ci
    POSTGRES_PASSWORD: disposable-ci-only
    POSTGRES_DB: edr_ci_test
    EDR_TEST_DATABASE_URL: "postgresql://edr_ci:disposable-ci-only@postgres:5432/edr_ci_test?sslmode=disable"
    EDR_QA_DISPOSABLE_DB: "yes"
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends postgresql-client
    - |
      ready=0
      for attempt in $(seq 1 30); do
        if pg_isready -h postgres -p 5432 -U edr_ci -d edr_ci_test; then
          ready=1
          break
        fi
        sleep 1
      done
      test "$ready" -eq 1
      psql "$EDR_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c 'SELECT current_setting(''server_version_num'')' | grep '^16'
  timeout: 20m

postgres_migration_chain:
  extends: .postgres16
  script:
    - bash scripts/test-postgres-migration-chain.sh
    - psql "$EDR_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/test-scan-job-results.sql
    - |
      if test -f scripts/test-soc-endpoint-inventory-sql.sh; then
        bash scripts/test-soc-endpoint-inventory-sql.sh
      else
        echo "SOC inventory real-SQL regression absent from this commit; NOT RUN"
      fi

postgres_scan_queue:
  extends: .postgres16
  script:
    - bash scripts/test-scan-job-queue.sh
    - bash scripts/test-scan-job-lease-renewal.sh
    - |
      if test -f scripts/test-scan-job-claim-revocation-race.sh; then
        bash scripts/test-scan-job-claim-revocation-race.sh
      else
        echo "Claim/revocation concurrency regression not present on this branch; NOT RUN"
      fi

postgres_enrollment:
  extends: .postgres16
  script:
    - bash scripts/test-enrollment-migration.sh

postgres_enrollment_atomic:
  extends: .postgres16
  script:
    - bash scripts/test-atomic-agent-enrollment.sh

postgres_enrollment_challenge:
  extends: .postgres16
  script:
    - bash scripts/test-enrollment-challenges.sh

postgres_revocation:
  extends: .postgres16
  script:
    - bash scripts/test-enrollment-revocation.sh

postgres_certificate_rotation:
  extends: .postgres16
  script:
    - bash scripts/test-certificate-rotation.sh
    - |
      if test -f scripts/test-certificate-rotation-tenant-race.sh; then
        bash scripts/test-certificate-rotation-tenant-race.sh
      else
        echo "Certificate rotation/tenant-disable concurrency regression absent; NOT RUN"
      fi

# No privileged Docker-in-Docker. Restart is performed on a LOCAL disposable
# unprivileged PostgreSQL data directory owned by postgres INSIDE this job.
postgres_challenge_restart:
  stage: postgres
  image: postgres:16-bookworm
  rules:
    - exists:
        - scripts/test-enrollment-challenge-db-restart.sh
  variables:
    QA_PGDATA: /tmp/turansec-edr-pg16
    EDR_TEST_DATABASE_URL: "postgresql://postgres@127.0.0.1:55432/edr_challenge_restart?sslmode=disable"
    EDR_QA_DISPOSABLE_DB: "yes"
  before_script:
    - mkdir -p "$QA_PGDATA"
    - chown postgres:postgres "$QA_PGDATA"
    - gosu postgres initdb -D "$QA_PGDATA" --no-instructions --auth-local=trust --auth-host=trust
    - gosu postgres pg_ctl -D "$QA_PGDATA" -o "-h 127.0.0.1 -p 55432" -l /tmp/turansec-edr-postgres.log start
    - psql -h 127.0.0.1 -p 55432 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE edr_challenge_restart'
    - psql "$EDR_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f backend/migrations/0001_agent_enrollment.up.sql
    - psql "$EDR_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f backend/migrations/0004_enrollment_challenges.up.sql
  script:
    - bash scripts/test-enrollment-challenge-db-restart.sh seed
    - gosu postgres pg_ctl -D "$QA_PGDATA" -m fast stop
    - gosu postgres pg_ctl -D "$QA_PGDATA" -o "-h 127.0.0.1 -p 55432" -l /tmp/turansec-edr-postgres.log start
    - bash scripts/test-enrollment-challenge-db-restart.sh verify
  after_script:
    - gosu postgres pg_ctl -D "$QA_PGDATA" -m immediate stop || true
  timeout: 20m
